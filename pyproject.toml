[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrubmcp"
version = "0.1.0"
description = "Local PII scrub + footprint hygiene MCP for agent pipelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Kevin Lance Murray", email = "HEADWOPZ@users.noreply.github.com" },
]
keywords = [
    "mcp",
    "pii",
    "privacy",
    "scrub",
    "redact",
    "hermes",
    "agent",
    "local-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scrubmcp = "scrubmcp.cli:main"

[project.urls]
Homepage = "https://github.com/HEADWOPZ/scrubmcp"
Repository = "https://github.com/HEADWOPZ/scrubmcp"
Issues = "https://github.com/HEADWOPZ/scrubmcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scrubmcp = ["py.typed", "data/*.txt", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "offline: tests that must never open a network socket",
]

[tool.ruff]
line-length = 100
target-version = "py310"

name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (offline) / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # Job-wide only. Do NOT set HTTP(S)_PROXY here — it blocks
      # checkout, setup-python, and pip install from PyPI.
      SCRUBMCP_LOG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + pytest
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Offline fixture tests
        env:
          SCRUBMCP_OFFLINE: "1"
        run: pytest -q
